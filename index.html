<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stats Trainer">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<title>ODU Stats Midterm Pretest Trainer</title>
<style>
  :root{
    --bg:#0e1116; --card:#171b22; --card2:#1d222b; --border:#2a313c;
    --text:#e8ecf1; --muted:#9aa4b2; --accent:#2dd4bf; --accent-ink:#04201c;
    --green:#22c55e; --green-bg:rgba(34,197,94,.14); --red:#ef4444; --red-bg:rgba(239,68,68,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100vh;display:flex;flex-direction:column}
  body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  button,input{font:inherit;color:inherit}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(14,17,22,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .topbar-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;cursor:pointer;border:0}
  .tb-title{font-weight:700;font-size:17px;line-height:1.2}
  .tb-sub{color:var(--muted);font-size:13px}
  main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:18px 16px 24px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));opacity:.8}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
  .stack>*+*{margin-top:12px}
  h1{font-size:28px;line-height:1.2;margin:4px 0 6px}
  h2{font-size:22px;margin:0 0 8px}
  .muted{color:var(--muted)}
  .btn{display:block;width:100%;min-height:54px;padding:14px 18px;border-radius:14px;border:1px solid var(--border);
    background:var(--card2);font-weight:600;font-size:18px;cursor:pointer;text-align:center;transition:transform .05s,filter .15s}
  .btn:active{transform:scale(.99)}
  .btn:hover:not(:disabled){filter:brightness(1.12)}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn-big{min-height:64px;font-size:20px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;cursor:pointer;min-height:52px}
  .toggle+.toggle{border-top:1px solid var(--border)}
  .toggle input{position:absolute;opacity:0;width:1px;height:1px}
  .switch{width:52px;height:32px;border-radius:999px;background:#39414d;position:relative;flex:none;transition:background .15s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
  .toggle input:checked+.switch{background:var(--accent)}
  .toggle input:checked+.switch::after{transform:translateX(20px)}
  .toggle input:focus-visible+.switch{outline:2px solid var(--accent);outline-offset:2px}
  .score-chip{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .score-big{font-size:26px;font-weight:800;color:var(--accent)}
  .progress-text{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;margin-bottom:8px}
  .bar{height:8px;background:#262c36;border-radius:999px;overflow:hidden;margin-bottom:16px}
  .bar>div{height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
  .prompt{white-space:pre-wrap;font-size:19px;margin:0 0 16px;word-wrap:break-word}
  .qnum{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
  .choices{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;border:0}
  .choice{display:flex;align-items:center;gap:14px;min-height:58px;padding:14px 16px;border:2px solid var(--border);
    border-radius:14px;background:var(--card2);cursor:pointer;transition:border-color .12s,background .12s}
  .choice input{position:absolute;opacity:0;width:1px;height:1px}
  .radio{width:24px;height:24px;border-radius:50%;border:2px solid #5b6574;flex:none;display:grid;place-items:center}
  .choice.selected{border-color:var(--accent)}
  .choice.selected .radio{border-color:var(--accent)}
  .choice.selected .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .choice:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
  .choice-text{flex:1;white-space:pre-wrap}
  .locked .choice{cursor:default}
  .choice.correct{border-color:var(--green);background:var(--green-bg)}
  .choice.correct .radio{border-color:var(--green);background:var(--green)}
  .choice.correct .radio::after{content:"✓";color:#04210f;background:none;width:auto;height:auto;font-size:15px;font-weight:900;line-height:1}
  .choice.wrong{border-color:var(--red);background:var(--red-bg)}
  .choice.wrong .radio{border-color:var(--red);background:var(--red)}
  .choice.wrong .radio::after{content:"✕";color:#2a0707;background:none;width:auto;height:auto;font-size:14px;font-weight:900;line-height:1}
  .locked .choice:not(.correct):not(.wrong){opacity:.6}
  .feedback{margin-top:16px;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:#12161c}
  .feedback .verdict{font-weight:800;margin-bottom:4px}
  .feedback.ok .verdict{color:var(--green)}
  .feedback.bad .verdict{color:var(--red)}
  .actions{margin-top:16px}
  .miss-item{padding:14px 0;border-top:1px solid var(--border)}
  .miss-item:first-child{border-top:0;padding-top:4px}
  .miss-stem{font-weight:600}
  .ans-line{font-size:16px;margin-top:4px}
  .ans-you{color:#fca5a5}.ans-right{color:#86efac}
  .search{width:100%;min-height:52px;padding:12px 16px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:18px;outline:none}
  .search:focus{border-color:var(--accent)}
  details.rq{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  details.rq+details.rq{margin-top:10px}
  details.rq summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
  details.rq summary::-webkit-details-marker{display:none}
  details.rq summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .15s;flex:none}
  details.rq[open] summary::after{transform:rotate(180deg)}
  .rq-id{color:var(--accent);font-weight:800;flex:none;min-width:30px}
  .rq-stem{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  details.rq[open] .rq-stem{display:none}
  .rq-body{padding:0 16px 16px}
  .rq-body ul{margin:8px 0 12px;padding-left:20px}
  .rq-body li{margin:4px 0}
  .rq-body li.is-answer{color:#86efac;font-weight:700}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--red-bg);color:#fca5a5;margin-left:6px;vertical-align:middle}
  .empty{text-align:center;color:var(--muted);padding:24px}
  .hidden{display:none!important}
  .link{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;font-weight:600}
  .btn-accent{background:rgba(45,212,191,.12);border:2px solid var(--accent);color:var(--accent)}
  .btn-accent .sub{display:block;font-size:14px;font-weight:600;opacity:.85}
  .btn-quick{text-align:center;border-color:rgba(45,212,191,.45)}
  .btn-quick .sub{display:block;font-size:14px;font-weight:600;color:var(--muted)}
  .mastery{font-size:14px;color:var(--muted);text-align:center}
  .mastery b{color:var(--text)}
  .conf-row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .conf-row .lbl{color:var(--muted);font-size:14px;margin-right:auto}
  .conf-btn{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card2);font-size:15px;font-weight:600;cursor:pointer}
  .conf-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(45,212,191,.12)}
  .next-due{font-size:14px;color:var(--muted);margin-top:8px}
  .again-tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--red-bg);color:#fca5a5;margin-left:6px}
  .due-row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)}
  .due-row:first-of-type{border-top:0}
  .why{margin-bottom:8px;padding:8px 10px;border-left:3px solid var(--red);background:rgba(239,68,68,.07);border-radius:6px;font-size:16px}
  .why b{color:#fca5a5}
  .rq-body ul.ww{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
  .rq-body .ww li{margin:4px 0}
  .ww .wc{color:#fca5a5;font-weight:600}
  .topic-card h3{margin:0 0 4px;font-size:18px}
  .tbar{height:10px;background:#262c36;border-radius:999px;overflow:hidden;margin:8px 0}
  .tbar>div{height:100%;border-radius:999px;background:var(--accent)}
  .tmeta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
  .tpct{font-weight:800;font-size:20px;color:var(--accent)}
  .trow{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px}
  .trow+.trow{margin-top:4px}
  .trow.weak{background:var(--red-bg);border:1px solid rgba(239,68,68,.4)}
  .weak-tag{font-size:12px;font-weight:700;color:#fca5a5;margin-left:6px}
  .reset-link{color:var(--muted);font-size:14px;display:block;margin:4px auto 0}
  .qm-sum{font-size:16px;color:var(--muted)}
  .qm-sum b{color:var(--text);font-size:24px}
  .qm-chips{display:flex;flex-wrap:wrap;gap:8px}
  .qm-chip{min-height:44px;min-width:44px;padding:6px 12px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .qm-chip small{font-size:13px;color:var(--muted);font-weight:600}
  .qm-chip.on{border-color:var(--accent);background:rgba(45,212,191,.12);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .qm-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
  .qm-legend span{display:inline-flex;align-items:center;gap:6px}
  .qm-legend i{display:inline-block;width:14px;height:14px;border-radius:4px;position:relative;border:1px solid var(--border);background:var(--card2)}
  .qm-group{padding:14px}
  .qm-ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
  .qm-ghead h3{margin:0;font-size:17px}
  .qm-ghead span{font-size:13px;color:var(--muted);white-space:nowrap}
  .qm-grid{display:grid;grid-template-columns:repeat(auto-fill,48px);gap:8px}
  .qm-tile{width:48px;height:48px;border-radius:12px;border:2px solid var(--border);background:var(--card2);color:var(--muted);font-weight:800;font-size:16px;cursor:pointer;position:relative;padding:0;display:grid;place-items:center;transition:transform .05s}
  .qm-tile:active{transform:scale(.95)}
  .qm-tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .qm-new{background:var(--card2);border-color:var(--border);color:var(--muted)}
  .qm-red{background:rgba(239,68,68,.22);border-color:var(--red);color:#fecaca}
  .qm-learn{background:rgba(234,179,8,.18);border-color:#eab308;color:#fde68a}
  .qm-mast{background:rgba(34,197,94,.22);border-color:var(--green);color:#bbf7d0}
  .qm-due::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
  .qm-legend i.qm-red{background:rgba(239,68,68,.22);border-color:var(--red)}
  .qm-legend i.qm-learn{background:rgba(234,179,8,.18);border-color:#eab308}
  .qm-legend i.qm-mast{background:rgba(34,197,94,.22);border-color:var(--green)}
  .qm-legend i.qm-due::after{top:-3px;right:-3px;width:7px;height:7px}
  .qm-tile.qm-sel{box-shadow:0 0 0 3px var(--accent)}
  .qm-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
  .qm-sheet{width:100%;max-width:760px;max-height:88vh;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-bottom:0;border-radius:18px 18px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:qmUp .18s ease-out}
  @keyframes qmUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.qm-sheet{animation:none}}
  .qm-grab{width:40px;height:5px;border-radius:999px;background:#3a424f;margin:0 auto 10px}
  .qm-pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--border);margin-right:6px}
  .qm-pill.qm-red,.qm-pill.qm-learn,.qm-pill.qm-mast,.qm-pill.qm-new{border-width:1px}
  .qm-statline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
  .qm-stat{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:8px 10px;text-align:center}
  .qm-stat b{display:block;font-size:20px}
  .qm-stat span{font-size:13px;color:var(--muted)}
  .qm-hist{font-size:14px;color:var(--muted);margin-bottom:10px}
  .qm-hist .h1{color:var(--green);font-weight:800}.qm-hist .h0{color:var(--red);font-weight:800}
  .qm-ans ul{margin:8px 0 10px;padding-left:20px}
  .qm-ans li{margin:4px 0}
  .qm-ans li.is-answer{color:#86efac;font-weight:700}
  @media (min-width:700px){ main{padding-top:28px} h1{font-size:34px} }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="logo" id="logoBtn" aria-label="Home">Σ</button>
    <div>
      <div class="tb-title">Stats Pretest Trainer</div>
      <div class="tb-sub">44 questions · intro stats</div>
    </div>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<footer>Study aid only. Verify against your own exam.</footer>

<script>
const QUESTIONS = [
  {
    id: 1,
    prompt: "The following is a partial relative frequency distribution of grades in an introductory statistics course.\n\nGrade | Relative Frequency\nA | 0.22\nB | ?\nC | 0.18\nD | 0.17\nE | 0.06\n\nFind the relative frequency for the B grade.",
    choices: [".47", ".37", ".27"],
    answer: ".37",
    explanation: "Relative frequencies of all categories must sum to 1. 0.22 + 0.18 + 0.17 + 0.06 = 0.63, so B = 1 − 0.63 = 0.37.",
    topic: "Graphs & distributions",
    whyWrong: {
      ".47": "Adding .47 to the other grades (0.63) gives 1.10, but relative frequencies must total exactly 1.",
      ".27": "Adding .27 to the other grades (0.63) gives only 0.90, so the frequencies would not sum to 1."
    }
  },
  {
    id: 2,
    prompt: "Probabilities must be assigned to sample space outcomes so that the probability assigned to each sample space outcome must be between ______ inclusive.",
    choices: ["−1 and 1", "0 and 100", "0 and 1", "−100 and 100"],
    answer: "0 and 1",
    explanation: "Kolmogorov axiom: any probability satisfies 0 ≤ P ≤ 1. Negative values are impossible; 0–100 would be a percent scale, not a probability.",
    topic: "Probability",
    whyWrong: {
      "−1 and 1": "A probability can never be negative, so −1 is not an allowed lower bound.",
      "0 and 100": "0 to 100 is the percent scale; as a probability the same values are written from 0 to 1.",
      "−100 and 100": "Probabilities cannot be negative and cannot exceed 1, so this range is wrong at both ends."
    }
  },
  {
    id: 3,
    prompt: "All of the following are used to describe quantitative data except the ________.",
    choices: ["stem-and-leaf chart", "histogram", "dot plot", "pie chart"],
    answer: "pie chart",
    explanation: "Stem-and-leaf, histogram, and dot plot display numeric data. A pie chart is for categorical (qualitative) proportions.",
    topic: "Graphs & distributions",
    whyWrong: {
      "stem-and-leaf chart": "A stem-and-leaf display splits each numeric value into stem and leaf, so it is made for quantitative data.",
      "histogram": "A histogram groups numeric values into classes, so it is a quantitative display.",
      "dot plot": "A dot plot places each numeric value on a number line, so it describes quantitative data."
    }
  },
  {
    id: 4,
    prompt: "Which of the following divides quantitative measurements into classes and graphs the frequency, relative frequency, or percentage frequency for each class?",
    choices: ["scatter plot", "histogram", "dot plot", "stem-and-leaf display"],
    answer: "histogram",
    explanation: "A histogram bins quantitative values into classes and draws a bar for each class frequency. Scatter plots show paired variables; dot plots and stem-and-leaf keep individual values.",
    topic: "Graphs & distributions",
    whyWrong: {
      "scatter plot": "A scatter plot shows the relationship between two paired quantitative variables, not class frequencies.",
      "dot plot": "A dot plot shows every individual value as a dot rather than grouping values into classes.",
      "stem-and-leaf display": "A stem-and-leaf display keeps the individual data values instead of graphing class frequencies as bars."
    }
  },
  {
    id: 5,
    prompt: "In a dataset about employees, which of the following would be considered a variable?",
    choices: [
      "the company's total number of employees",
      "each employee's annual salary",
      "the average salary across all departments",
      "the specific employee \"John Smith\""
    ],
    answer: "each employee's annual salary",
    explanation: "A variable is a characteristic that takes different values across units. Salary varies by employee. Head-count and the overall average are single summaries; John Smith is one observational unit.",
    topic: "Data & variables",
    whyWrong: {
      "the company's total number of employees": "The total head count is one number for the whole company, so it does not vary from employee to employee.",
      "the average salary across all departments": "An overall average is a single summary statistic, not a characteristic measured on each employee.",
      "the specific employee \"John Smith\"": "John Smith is one unit (element) in the dataset, not a characteristic measured on the units."
    }
  },
  {
    id: 6,
    prompt: "Which percentile describes the first quartile, Q1?",
    choices: ["25th", "100th", "50th", "75th"],
    answer: "25th",
    explanation: "Q1 is the 25th percentile, Q2/median is the 50th, Q3 is the 75th, and the 100th is the maximum.",
    topic: "Center & spread",
    whyWrong: {
      "100th": "The 100th percentile is the maximum value, not the first quartile.",
      "50th": "The 50th percentile is the median (Q2), not Q1.",
      "75th": "The 75th percentile is the third quartile (Q3), not Q1."
    }
  },
  {
    id: 7,
    prompt: "A ________ is a measure of the chance that an uncertain event will occur.",
    choices: ["probability", "complement", "population", "sample space", "random experiment"],
    answer: "probability",
    explanation: "Probability is the numerical measure of likelihood. The other terms are related objects (event opposite, collection of units, set of outcomes, or the process), not the measure itself.",
    topic: "Probability",
    whyWrong: {
      "complement": "A complement is the event that A does not occur; it is an event, not a measure of chance.",
      "population": "A population is the full set of units being studied, not a measure of chance.",
      "sample space": "The sample space is the set of all possible outcomes, not the number measuring how likely they are.",
      "random experiment": "A random experiment is the process that produces outcomes, not a measure of how likely they are."
    }
  },
  {
    id: 8,
    prompt: "A Pareto chart is specifically designed to",
    choices: [
      "show the cumulative frequency of categories in a qualitative dataset.",
      "display the distribution of a single quantitative variable.",
      "highlight the most frequent categories contributing to a problem or outcome.",
      "compare proportions of different categories in a pie-like format."
    ],
    answer: "highlight the most frequent categories contributing to a problem or outcome.",
    explanation: "A Pareto chart orders categorical bars from most to least frequent (often with a cumulative line) so the vital-few categories that drive a problem stand out. Histograms show quantitative distributions; pie charts show category proportions.",
    topic: "Graphs & distributions",
    whyWrong: {
      "show the cumulative frequency of categories in a qualitative dataset.": "A Pareto chart may add a cumulative line, but its purpose is ordering categories so the biggest contributors stand out.",
      "display the distribution of a single quantitative variable.": "Showing the distribution of one quantitative variable is the job of a histogram; Pareto charts are for categories.",
      "compare proportions of different categories in a pie-like format.": "Pie charts show category proportions as slices; a Pareto chart uses bars sorted from tallest to shortest."
    }
  },
  {
    id: 9,
    prompt: "A(n) ________ is the probability that one event will occur given that we know that another event already has occurred.",
    choices: [
      "subjective probability",
      "long-run relative frequency",
      "complement of events",
      "sample space outcome",
      "conditional probability"
    ],
    answer: "conditional probability",
    explanation: "Conditional probability is P(A|B) = P(A ∩ B) / P(B): the chance of A given that B has occurred.",
    topic: "Probability",

    if (!ids.length) { renderHome(); return; }
    const choiceOrder = {};
    ids.forEach(id => { const c = BY_ID[id].choices; choiceOrder[id] = prefs.shuffleC ? shuffle(c) : c.slice(); });
    session = { mode: "due", ids, choiceOrder, index: 0, answers: {}, pending: {}, srPrev: {}, conf: {}, started: new Date().toISOString() };
    saveSession();
    renderQuiz();
  }
  function finishDue(){
    const s = session;
    const seen = []; const first = {};
    s.ids.forEach((id, i) => {
      if (!(id in first)) { seen.push(id); first[id] = s.answers["s" + i] === BY_ID[id].answer; }
    });
    const correct = seen.filter(id => first[id]).length;
    const srs = getSrs();
    const byDay = {};
    seen.forEach(id => { const d = srs[id] && srs[id].due; if (d) byDay[d] = (byDay[d] || 0) + 1; });
    lastResult = { mode: "due", reviewed: seen.length, attempts: s.ids.length, correct,
      percent: seen.length ? Math.round(correct / seen.length * 1000) / 10 : 0,
      missed: seen.filter(id => !first[id]), byDay, results: seen.map(id => ({ id, correct: first[id] })) };
    session = null;
    remove(K_SESSION);
    renderDueResults();
  }
  function renderDueResults(){
    const r = lastResult;
    const st = srStats();
    const days = Object.keys(r.byDay).sort();
    app.innerHTML = `
      <div class="stack">
        <div class="card" style="text-align:center">
          <div class="muted">Review session complete</div>
          <div id="reviewedText" style="font-size:44px;font-weight:800;color:var(--accent);line-height:1.2;margin:6px 0">${r.reviewed} card${r.reviewed === 1 ? "" : "s"}</div>
          <div style="font-size:22px;font-weight:700" id="accText">${r.percent}% first-try accuracy</div>
          <div class="muted" style="font-size:15px">${r.correct} of ${r.reviewed} right first time · ${r.attempts} answers total</div>
        </div>
        <div class="card" id="nextReviews">
          <h2>Next reviews</h2>
          ${days.map(d => `<div class="due-row"><span>${esc(fmtDay(d))}</span><span class="muted">${r.byDay[d]} card${r.byDay[d] === 1 ? "" : "s"}</span></div>`).join("")}
          <div class="muted" style="font-size:14px;margin-top:8px">${st.due + st.newAvail ? `Still available today: ${st.due} due · ${st.newAvail} new` : `All caught up.${st.nextDue ? " Next review: " + esc(fmtDay(st.nextDue)) : ""}`}</div>
        </div>
        ${r.missed.length ? `<div class="card" id="missedList"><h2>Missed first time (${r.missed.length})</h2>
          ${r.missed.map(id => { const q = BY_ID[id]; return `<div class="miss-item"><div class="miss-stem"><span style="color:var(--accent)">#${q.id}</span> ${esc(shortStem(q))}</div><div class="ans-line ans-right">Correct: ${esc(q.answer)}</div></div>`; }).join("")}
        </div>` : ""}
        ${topicBreakdownHtml(r.results)}
        <div class="btn-row">
          <button class="btn btn-primary" id="homeBtn">Home</button>
          <button class="btn" id="reviewAll">Review all</button>
        </div>
      </div>`;
    wireWeak(r.results);
    document.getElementById("homeBtn").onclick = () => renderHome();
    document.getElementById("reviewAll").onclick = () => renderReview();
    scrollTop();
  }

  // ---------- state ----------
  let session = null;   // {mode, ids, choiceOrder:{id:[...]}, index, answers:{id:choice}, pending:{id:choice}}
  let lastResult = null;
  let reviewQuery = "";

  function saveSession(){ if (session) save(K_SESSION, session); }

  function validSession(s){
    return s && Array.isArray(s.ids) && s.ids.length > 0 && s.ids.every(id => BY_ID[id]) &&
      typeof s.index === "number" && s.index >= 0 && s.index < s.ids.length && s.answers && typeof s.answers === "object";
  }

  function startQuiz(mode, topic, idList){
    const prefs = getPrefs();
    let ids = Array.isArray(idList) ? idList.filter(id => BY_ID[id])
      : mode === "missed" ? getMissed()
      : mode === "topic" ? QUESTIONS.filter(q => q.topic === topic).map(q => q.id)
      : QUESTIONS.map(q => q.id);
    if (!ids.length) { renderHome(); return; }
    if (prefs.shuffleQ) ids = shuffle(ids);
    const choiceOrder = {};
    ids.forEach(id => { const c = BY_ID[id].choices; choiceOrder[id] = prefs.shuffleC ? shuffle(c) : c.slice(); });
    session = { mode, ids, choiceOrder, index: 0, answers: {}, pending: {}, started: new Date().toISOString() };
    if (mode === "topic") session.topic = topic;
    saveSession();
    renderQuiz();
  }

  // Quick quiz: the QUICK_N least-attempted questions (unseen = 0), then oldest lastSeen, random among exact ties
  const QUICK_N = 5;
  function pickQuickIds(){
    const stats = getStats();
    return shuffle(QUESTIONS.map(q => q.id)).map(id => {
      const e = stats[id] || {};
      return { id, a: typeof e.attempts === "number" ? e.attempts : 0, t: e.lastSeen ? Date.parse(e.lastSeen) || 0 : 0 };
    }).sort((x, y) => x.a - y.a || x.t - y.t).slice(0, QUICK_N).map(x => x.id);
  }
  function startQuick(){
    const prefs = getPrefs();
    const ids = pickQuickIds();
    const choiceOrder = {};
    ids.forEach(id => { const c = BY_ID[id].choices; choiceOrder[id] = prefs.shuffleC ? shuffle(c) : c.slice(); });
    session = { mode: "quick", ids, choiceOrder, index: 0, answers: {}, pending: {}, started: new Date().toISOString() };
    saveSession();
    renderQuiz();
  }

  function finishQuiz(){
    const s = session;
    const total = s.ids.length;
    let correct = 0; const missed = [];
    s.ids.forEach(id => {
      if (s.answers[id] === BY_ID[id].answer) correct++;
      else missed.push({ id, yours: s.answers[id] });
    });
    const percent = Math.round((correct / total) * 1000) / 10;
    save(K_LAST, { correct, total, percent, date: new Date().toISOString() });

    // Update missed ids
    let stored;
    if (s.mode === "missed" || s.mode === "topic" || s.mode === "quick" || s.mode === "map" || s.mode === "red") {
      // Remove questions now answered correctly; keep everything else previously missed
      const nowCorrect = new Set(s.ids.filter(id => s.answers[id] === BY_ID[id].answer));
      stored = getMissed().filter(id => !nowCorrect.has(id));
      missed.forEach(m => { if (!stored.includes(m.id)) stored.push(m.id); });
    } else {
      stored = missed.map(m => m.id);
    }
    save(K_MISSED, stored.sort((a,b)=>a-b));

    lastResult = { correct, total, percent, missed, mode: s.mode, topic: s.topic,
      results: s.ids.map(id => ({ id, correct: s.answers[id] === BY_ID[id].answer })) };
    session = null;
    remove(K_SESSION);
    renderResults();
  }

  // ---------- views ----------
  function scrollTop(){ window.scrollTo(0, 0); }

  function renderHome(){
    const prefs = getPrefs();
    const last = load(K_LAST, null);
    const missed = getMissed();
    const saved = load(K_SESSION, null);
    const canResume = validSession(saved);
    const st = srStats();
    const dueTotal = st.due + st.newAvail;
    app.innerHTML = `
      <div class="stack">
        <div>
          <h1>ODU Stats Midterm Pretest Trainer</h1>
          <div class="muted">44-question intro stats pretest drill</div>
        </div>
        ${last && typeof last.correct === "number" ? `
        <div class="card" id="lastScore">
          <div class="muted" style="font-size:14px">Last score${last.date ? " · " + esc(fmtDate(last.date)) : ""}</div>
          <div class="score-chip"><span class="score-big">${last.correct} / ${last.total}</span><span class="muted">${last.percent}%</span></div>
        </div>` : ""}
        ${canResume ? `
        <button class="btn btn-primary btn-big" id="resumeBtn">Resume ${saved.mode === "due" ? "review" : saved.mode === "quick" ? "quick quiz" : "quiz"} · Q${saved.index + 1} of ${saved.ids.length}</button>` : ""}
        <button class="btn btn-accent btn-big" id="dueBtn" ${dueTotal ? "" : "disabled"}>${dueTotal
          ? `Due for review (${st.due})<span class="sub">${st.newAvail} new · overdue first</span>`
          : `All caught up<span class="sub">Next review: ${st.nextDue ? esc(fmtDay(st.nextDue)) : "—"}</span>`}</button>
        <div class="mastery" id="masteryLine">Mastered <b>${st.mastered}</b> · Learning <b>${st.learning}</b> · New <b>${st.fresh}</b></div>
        <button class="btn ${canResume ? "" : "btn-primary"} btn-big" id="startBtn">${canResume ? "Start new quiz" : "Start Quiz"}</button>
        <button class="btn btn-big btn-quick" id="quickBtn">Quick quiz · ${QUICK_N} questions<span class="sub">Your least-seen questions</span></button>
        <button class="btn" id="missedBtn" ${missed.length ? "" : "disabled"}>Practice missed only${missed.length ? ` (${missed.length})` : ""}</button>
        <button class="btn" id="reviewBtn">Review all Q&amp;A</button>
        <button class="btn" id="topicsBtn">Progress by topic</button>
        <button class="btn" id="qmapBtn">Question map</button>
        <div class="card" style="padding:4px 18px">
          <label class="toggle"><span>Shuffle questions</span><input type="checkbox" id="shuffleQ" ${prefs.shuffleQ ? "checked" : ""}><span class="switch"></span></label>
          <label class="toggle"><span>Shuffle answer choices</span><input type="checkbox" id="shuffleC" ${prefs.shuffleC ? "checked" : ""}><span class="switch"></span></label>
        </div>
        <button class="link reset-link" id="resetBtn">Reset progress</button>
      </div>`;
    const setPref = (k, v) => { const p = getPrefs(); p[k] = v; save(K_PREFS, p); };
    document.getElementById("shuffleQ").onchange = e => setPref("shuffleQ", e.target.checked);
    document.getElementById("shuffleC").onchange = e => setPref("shuffleC", e.target.checked);
    document.getElementById("startBtn").onclick = () => startQuiz("all");
    document.getElementById("quickBtn").onclick = () => startQuick();
    document.getElementById("missedBtn").onclick = () => startQuiz("missed");
    document.getElementById("reviewBtn").onclick = () => renderReview();
    document.getElementById("dueBtn").onclick = () => startDue();
    document.getElementById("topicsBtn").onclick = () => renderTopics();
    document.getElementById("qmapBtn").onclick = () => renderQMap();
    document.getElementById("resetBtn").onclick = () => {
      if (!confirm("Reset all progress? This clears spaced-repetition history, topic stats, missed questions, and your last score.")) return;
      remove(K_SRS); remove(K_STATS); remove(K_MISSED); remove(K_LAST);
      renderHome();
    };
    if (canResume) document.getElementById("resumeBtn").onclick = () => { session = saved; session.pending = session.pending || {}; renderQuiz(); };
    scrollTop();
  }

  function renderQuiz(){
    const s = session;
    const id = s.ids[s.index];
    const q = BY_ID[id];
    const order = (s.choiceOrder && s.choiceOrder[id]) || q.choices;
    const k = keyAt(s, s.index);
    const checked = Object.prototype.hasOwnProperty.call(s.answers, k);
    const chosen = checked ? s.answers[k] : (s.pending && s.pending[k]);
    const isRepeat = s.mode === "due" && s.ids.slice(0, s.index).includes(id);
    const canConf = checked && s.srPrev && Object.prototype.hasOwnProperty.call(s.srPrev, k);
    const conf = (s.conf && s.conf[k]) || "knew";
    const curSr = getSrs()[id];
    const total = s.ids.length;
    const isLast = s.index === total - 1;
    const pct = ((s.index + (checked ? 1 : 0)) / total) * 100;
    const isRight = checked && chosen === q.answer;

    const choicesHtml = order.map((c, i) => {
      let cls = "choice";
      if (checked) {
        if (c === q.answer) cls += " correct";
        else if (c === chosen) cls += " wrong";
      } else if (c === chosen) cls += " selected";
      return `<label class="${cls}" data-i="${i}">
          <input type="radio" name="choice" value="${i}" ${c === chosen ? "checked" : ""} ${checked ? "disabled" : ""}>
          <span class="radio"></span><span class="choice-text">${esc(c)}</span></label>`;
    }).join("");

    app.innerHTML = `
      <div>
        <div class="progress-text"><span id="progressText">Question ${s.index + 1} of ${total}</span>
          <span>${s.mode === "missed" ? "Missed only" : s.mode === "due" ? "Due review" : s.mode === "topic" ? esc(s.topic || "") : s.mode === "quick" ? "Quick quiz" : s.mode === "map" ? "Question map" : s.mode === "red" ? "Struggling" : ""}</span></div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${s.index + (checked?1:0)}"><div style="width:${pct}%"></div></div>
        <div class="card">
          <div class="qnum">Pretest #${q.id}${isRepeat ? '<span class="again-tag">again</span>' : ""}</div>
          <p class="prompt">${esc(q.prompt)}</p>
          <fieldset class="choices ${checked ? "locked" : ""}" id="choices">
            <legend class="hidden">Choices</legend>
            ${choicesHtml}
          </fieldset>
          ${checked ? `
          <div class="feedback ${isRight ? "ok" : "bad"}" id="feedback">
            <div class="verdict">${isRight ? "Correct!" : "Not quite."}</div>
            ${isRight ? "" : `<div style="margin-bottom:6px">Correct answer: <strong>${esc(q.answer)}</strong></div>`}
            ${!isRight && q.whyWrong && q.whyWrong[chosen] ? `<div class="why" id="whyWrong"><b>Why not "${esc(chosen)}"?</b> ${esc(q.whyWrong[chosen])}</div>` : ""}
            <div class="muted" style="color:#c9d1db">${esc(q.explanation)}</div>
            ${isRight && canConf ? `
            <div class="conf-row" id="confRow"><span class="lbl">How sure were you?</span>
              <button class="conf-btn ${conf === "guessed" ? "on" : ""}" data-conf="guessed" aria-pressed="${conf === "guessed"}">Guessed</button>
              <button class="conf-btn ${conf === "knew" ? "on" : ""}" data-conf="knew" aria-pressed="${conf === "knew"}">Knew it</button>
            </div>` : ""}
            ${canConf && curSr ? `<div class="next-due" id="nextDue">Next review: ${isRight ? esc(fmtIn(daysBetween(todayStr(), curSr.due))) : s.mode === "due" ? "comes back later this session" : "today"}</div>` : ""}
          </div>` : ""}
          <div class="actions">
            ${checked
              ? `<button class="btn btn-primary btn-big" id="nextBtn">${isLast ? "Finish" : "Next →"}</button>`
              : `<button class="btn btn-primary btn-big" id="checkBtn" ${chosen != null ? "" : "disabled"}>Check answer</button>`}
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:10px">
          <button class="link" id="quitBtn">← Home (progress saved)</button>
          ${s.index > 0 ? `<button class="link" id="prevBtn">Previous</button>` : ""}
        </div>
      </div>`;

    if (!checked) {
      app.querySelectorAll('input[name="choice"]').forEach(inp => {
        inp.addEventListener("change", () => {
          s.pending = s.pending || {};
          s.pending[k] = order[+inp.value];
          saveSession();
          app.querySelectorAll(".choice").forEach(l => l.classList.toggle("selected", l.querySelector("input").checked));
          document.getElementById("checkBtn").disabled = false;
        });
      });
      document.getElementById("checkBtn").onclick = () => {
        const sel = app.querySelector('input[name="choice"]:checked');
        if (!sel) return;
        const ans = order[+sel.value];
        s.answers[k] = ans;
        if (s.pending) delete s.pending[k];
        recordAnswer(s, k, id, ans === q.answer);
        if (s.mode === "due" && ans !== q.answer) {
          // re-queue a few cards later; must be answered correctly before the session ends
          s.ids.splice(Math.min(s.index + 4, s.ids.length), 0, id);
          // shift slot-keyed data after the insertion point
          const at = Math.min(s.index + 4, s.ids.length - 1);
          ["answers", "pending", "srPrev", "conf"].forEach(f => {
            const o = s[f]; if (!o) return; const n = {};
            Object.keys(o).forEach(key => { const i = +key.slice(1); n[i >= at ? "s" + (i + 1) : key] = o[key]; });
            s[f] = n;
          });
        }
        saveSession();
        renderQuiz();
        const fb = document.getElementById("feedback");
        if (fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest", behavior:"smooth"});
      };
    } else {
      document.getElementById("nextBtn").onclick = () => {
        if (isLast) { if (s.mode === "due") finishDue(); else finishQuiz(); return; }
        s.index++; saveSession(); renderQuiz(); scrollTop();
      };
    }
    app.querySelectorAll(".conf-btn").forEach(b => b.onclick = () => { setConfidence(s, k, id, b.dataset.conf); saveSession(); renderQuiz(); });
    document.getElementById("quitBtn").onclick = () => { saveSession(); session = null; renderHome(); };
    const prev = document.getElementById("prevBtn");
    if (prev) prev.onclick = () => { s.index--; saveSession(); renderQuiz(); scrollTop(); };
  }

  function renderResults(){
    const r = lastResult;
    const missedNow = getMissed();
    const list = r.missed.map(m => {
      const q = BY_ID[m.id];
      return `<div class="miss-item">
        <div class="miss-stem"><span style="color:var(--accent)">#${q.id}</span> ${esc(shortStem(q))}</div>
        <div class="ans-line ans-you">Your answer: ${m.yours == null ? "<em>(none)</em>" : esc(m.yours)}</div>
        <div class="ans-line ans-right">Correct: ${esc(q.answer)}</div>
      </div>`;
    }).join("");
    app.innerHTML = `
      <div class="stack">
        <div class="card" style="text-align:center">
          <div class="muted">${r.mode === "missed" ? "Missed-only practice" : r.mode === "topic" ? esc(r.topic) + " practice" : r.mode === "quick" ? "Quick quiz" : r.mode === "map" ? "Single question" : r.mode === "red" ? "Struggling practice" : "Quiz"} complete</div>
          <div id="scoreText" style="font-size:44px;font-weight:800;color:var(--accent);line-height:1.2;margin:6px 0">${r.correct} / ${r.total}</div>
          <div style="font-size:22px;font-weight:700" id="pctText">${r.percent}%</div>
        </div>
        ${r.results ? topicBreakdownHtml(r.results) : ""}
        <div class="card" id="missedList">
          <h2>Missed questions (${r.missed.length})</h2>
          ${r.missed.length ? list : `<div class="empty">Perfect run — nothing missed. 🎉</div>`}
        </div>
        ${r.mode === "quick" ? `<button class="btn btn-primary btn-big" id="anotherQuick">Another quick quiz</button>` : ""}
        ${r.mode === "map" || r.mode === "red" ? `<button class="btn btn-primary btn-big" id="backToMap">Back to Question map</button>` : ""}
        <div class="btn-row">
          <button class="btn ${r.mode === "quick" || r.mode === "map" || r.mode === "red" ? "" : "btn-primary"}" id="retryAll">Retry all</button>
          <button class="btn" id="retryMissed" ${missedNow.length ? "" : "disabled"}>Retry missed only${missedNow.length ? ` (${missedNow.length})` : ""}</button>
          <button class="btn" id="reviewAll">Review all</button>
          <button class="btn" id="homeBtn">Home</button>
        </div>
      </div>`;
    if (r.results) wireWeak(r.results);
    document.getElementById("retryAll").onclick = () => startQuiz("all");
    if (r.mode === "quick") document.getElementById("anotherQuick").onclick = () => startQuick();
    const btm = document.getElementById("backToMap"); if (btm) btm.onclick = () => renderQMap(r.results.length === 1 ? r.results[0].id : null);
    document.getElementById("retryMissed").onclick = () => startQuiz("missed");
    document.getElementById("reviewAll").onclick = () => renderReview();
    document.getElementById("homeBtn").onclick = () => renderHome();
    scrollTop();
  }

  function renderReview(){
    const missedSet = new Set(getMissed());
    const cards = QUESTIONS.map(q => `
      <details class="rq" data-id="${q.id}" data-text="${esc(q.prompt.toLowerCase())}">
        <summary><span class="rq-id">${q.id}.</span><span class="rq-stem">${esc(q.prompt)}</span></summary>
        <div class="rq-body">
          <p class="prompt" style="font-size:17px;margin:0 0 8px">${esc(q.prompt)}${missedSet.has(q.id) ? '<span class="tag">missed</span>' : ""}</p>
          <ul>${q.choices.map(c => `<li class="${c === q.answer ? "is-answer" : ""}">${esc(c)}${c === q.answer ? " ✓" : ""}</li>`).join("")}</ul>
          <div><strong style="color:#86efac">Answer:</strong> ${esc(q.answer)}</div>
          <div class="muted" style="margin-top:6px;color:#c9d1db">${esc(q.explanation)}</div>
          ${q.whyWrong ? `<ul class="ww">${q.choices.filter(c => c !== q.answer && q.whyWrong[c]).map(c => `<li><span class="wc">✕ ${esc(c)}:</span> ${esc(q.whyWrong[c])}</li>`).join("")}</ul>` : ""}
        </div>
      </details>`).join("");
    app.innerHTML = `
      <div class="stack">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <h2 style="margin:0">Review all Q&amp;A</h2>
          <button class="link" id="homeBtn">← Home</button>
        </div>
        <input class="search" id="search" type="search" placeholder="Search question text…" autocomplete="off" value="${esc(reviewQuery)}" aria-label="Search questions">
        <div class="muted" style="font-size:14px" id="countText"></div>
        <div style="display:flex;gap:16px"><button class="link" id="expandAll">Expand all</button><button class="link" id="collapseAll">Collapse all</button></div>
        <div id="reviewList">${cards}</div>
        <div class="empty hidden" id="noResults">No questions match your search.</div>
      </div>`;
    const input = document.getElementById("search");
    const apply = () => {
      reviewQuery = input.value;
      const term = reviewQuery.trim().toLowerCase();
      let shown = 0;
      app.querySelectorAll("details.rq").forEach(d => {
        const q = BY_ID[+d.dataset.id];
        const match = !term || q.prompt.toLowerCase().includes(term);
        d.classList.toggle("hidden", !match);
        if (match) shown++;
      });
      document.getElementById("countText").textContent = `Showing ${shown} of ${QUESTIONS.length}`;
      document.getElementById("noResults").classList.toggle("hidden", shown !== 0);
    };
    input.addEventListener("input", apply);
    apply();
    document.getElementById("expandAll").onclick = () => app.querySelectorAll("details.rq:not(.hidden)").forEach(d => d.open = true);
    document.getElementById("collapseAll").onclick = () => app.querySelectorAll("details.rq").forEach(d => d.open = false);
    document.getElementById("homeBtn").onclick = () => renderHome();
    scrollTop();
  }

  document.getElementById("logoBtn").onclick = () => { closeQDetail(); if (session) saveSession(); session = null; renderHome(); };

  // ---------- boot: resume mid-quiz after refresh ----------
  const saved = load(K_SESSION, null);
  if (validSession(saved)) { session = saved; session.pending = session.pending || {}; renderQuiz(); }
  else { if (saved) remove(K_SESSION); renderHome(); }
})();
</script>
</body>
</html>
